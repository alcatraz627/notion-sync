<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="notion-sync architecture — pipeline, dashboards, caches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c1430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-mag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e879f9"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="url(#bg)" rx="10"/>
  <rect x="0" y="0" width="960" height="3" fill="url(#accent)"/>

  <!-- Title bar -->
  <text x="32" y="34" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#22d3ee">notion-sync</text>
  <text x="138" y="34" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7d8590">— architecture · v1.2.0 · markdown → Notion mirror</text>
  <text x="928" y="34" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#e879f9" text-anchor="end">▶</text>

  <!-- ==================== LOCAL (left) ==================== -->
  <rect x="24" y="60" width="220" height="170" rx="8" fill="url(#cyan)" stroke="#22d3ee" stroke-width="1"/>
  <text x="36" y="84" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#22d3ee">▸ LOCAL</text>

  <rect x="40" y="98" width="188" height="34" rx="4" fill="#0a0d12" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="50" y="118" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">📄 docs/**/*.md</text>
  <text x="50" y="129" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">frontmatter + body</text>

  <rect x="40" y="140" width="188" height="34" rx="4" fill="#0a0d12" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="50" y="160" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">🖼  images/</text>
  <text x="50" y="171" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">sha256-deduped</text>

  <rect x="40" y="182" width="188" height="34" rx="4" fill="#0a0d12" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="50" y="202" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">⚙  .env</text>
  <text x="50" y="213" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">NOTION_TOKEN, root_id…</text>

  <!-- ==================== ENGINE (center) ==================== -->
  <rect x="280" y="60" width="400" height="290" rx="8" fill="url(#magenta)" stroke="#e879f9" stroke-width="1"/>
  <text x="292" y="84" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#e879f9">▸ SYNC ENGINE — index.ts</text>

  <!-- Phase 1 -->
  <rect x="296" y="98" width="368" height="48" rx="4" fill="#0a0d12" stroke="#e879f9" stroke-width="0.5"/>
  <text x="306" y="116" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#22d3ee" font-weight="700">Phase 1 · Discovery</text>
  <text x="306" y="130" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#e6edf3">getOrCreateChildPage · globalTitleIndex · MOVE</text>
  <text x="306" y="142" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">consults .notion-cache.json for rename-safety</text>

  <!-- Phase 1.5 -->
  <rect x="296" y="154" width="368" height="44" rx="4" fill="#0a0d12" stroke="#e879f9" stroke-width="0.5"/>
  <text x="306" y="172" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#22d3ee" font-weight="700">Phase 1.5 · Section content</text>
  <text x="306" y="186" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#e6edf3">list-blocks → delete-prose → insert_content</text>
  <text x="306" y="194" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">preserves child_page subpages</text>

  <!-- Phase 2 -->
  <rect x="296" y="206" width="368" height="60" rx="4" fill="#0a0d12" stroke="#e879f9" stroke-width="0.5"/>
  <text x="306" y="224" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#22d3ee" font-weight="700">Phase 2 · Leaf content</text>
  <text x="306" y="238" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#e6edf3">image-uploader → updateMarkdown → mention-converter</text>
  <text x="306" y="252" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">.md links → native page mentions · external img → CDN</text>
  <text x="306" y="262" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">retry pass: up to 3 attempts each on transient 5xx</text>

  <!-- Telemetry -->
  <rect x="296" y="274" width="368" height="62" rx="4" fill="#0a0d12" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="306" y="292" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#fbbf24" font-weight="700">Telemetry · runs.jsonl</text>
  <text x="306" y="306" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#e6edf3">run_id · stats · timing · pages[] · error_summary[]</text>
  <text x="306" y="318" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">suspicion engine: WAF / size / content rules</text>
  <text x="306" y="328" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">crash-safe: partial logs on Ctrl-C / SIGTERM</text>

  <!-- ==================== NOTION (right) ==================== -->
  <rect x="716" y="60" width="220" height="290" rx="8" fill="url(#magenta)" stroke="#e879f9" stroke-width="1"/>
  <text x="728" y="84" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#e879f9">▸ NOTION API · v5</text>

  <rect x="732" y="98" width="188" height="40" rx="4" fill="#0a0d12" stroke="#e879f9" stroke-width="0.5"/>
  <text x="742" y="116" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">📄 pages</text>
  <text x="742" y="129" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">create · update · retrieve</text>

  <rect x="732" y="146" width="188" height="40" rx="4" fill="#0a0d12" stroke="#e879f9" stroke-width="0.5"/>
  <text x="742" y="164" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">🧱 blocks</text>
  <text x="742" y="177" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">children.list · append · update · delete</text>

  <rect x="732" y="194" width="188" height="40" rx="4" fill="#0a0d12" stroke="#e879f9" stroke-width="0.5"/>
  <text x="742" y="212" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">📊 databases / dataSources</text>
  <text x="742" y="225" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">D4 sidecar Index DB</text>

  <rect x="732" y="242" width="188" height="40" rx="4" fill="#0a0d12" stroke="#e879f9" stroke-width="0.5"/>
  <text x="742" y="260" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">📤 fileUploads (CDN)</text>
  <text x="742" y="273" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">create · send · list</text>

  <rect x="732" y="290" width="188" height="48" rx="4" fill="#0a0d12" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="742" y="308" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#fbbf24" font-weight="700">⏱  rate limit</text>
  <text x="742" y="322" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">adaptive 350-1050ms</text>
  <text x="742" y="332" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">linear backoff on 5xx · narrows after 3 OK</text>

  <!-- ==================== DASHBOARDS (bottom-left wide) ==================== -->
  <rect x="24" y="376" width="568" height="138" rx="8" fill="url(#green)" stroke="#3fb950" stroke-width="1"/>
  <text x="36" y="400" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#3fb950">▸ DASHBOARDS — read-only consumers of cache + runs.jsonl</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">
    <rect x="40" y="412" width="170" height="42" rx="4" fill="#0a0d12" stroke="#3fb950" stroke-width="0.5"/>
    <text x="50" y="430">🗺️  sitemap</text>
    <text x="50" y="446" font-size="9" fill="#7d8590">terse tree-view, blocks API</text>

    <rect x="218" y="412" width="170" height="42" rx="4" fill="#0a0d12" stroke="#3fb950" stroke-width="0.5"/>
    <text x="228" y="430">🏷️  tag-index</text>
    <text x="228" y="446" font-size="9" fill="#7d8590">351 tags × pages, frontmatter</text>

    <rect x="396" y="412" width="180" height="42" rx="4" fill="#0a0d12" stroke="#3fb950" stroke-width="0.5"/>
    <text x="406" y="430">📇 index-db</text>
    <text x="406" y="446" font-size="9" fill="#7d8590">D4 sidecar database</text>

    <rect x="40" y="460" width="170" height="42" rx="4" fill="#0a0d12" stroke="#3fb950" stroke-width="0.5"/>
    <text x="50" y="478">📣 recent-feed</text>
    <text x="50" y="494" font-size="9" fill="#7d8590">last 50 unique syncs</text>

    <rect x="218" y="460" width="170" height="42" rx="4" fill="#0a0d12" stroke="#3fb950" stroke-width="0.5"/>
    <text x="228" y="478">🔗 backlinks</text>
    <text x="228" y="494" font-size="9" fill="#7d8590">"Linked from" callouts</text>

    <rect x="396" y="460" width="180" height="42" rx="4" fill="#0a0d12" stroke="#3fb950" stroke-width="0.5"/>
    <text x="406" y="478">🩺 health</text>
    <text x="406" y="494" font-size="9" fill="#7d8590">latest run status page</text>
  </g>

  <!-- ==================== STATE (bottom-right) ==================== -->
  <rect x="616" y="376" width="320" height="138" rx="8" fill="url(#amber)" stroke="#fbbf24" stroke-width="1"/>
  <text x="628" y="400" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#fbbf24">▸ STATE / CACHES (gitignored)</text>

  <rect x="632" y="412" width="288" height="30" rx="4" fill="#0a0d12" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="642" y="431" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">📋 .notion-cache.json</text>

  <rect x="632" y="446" width="288" height="30" rx="4" fill="#0a0d12" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="642" y="465" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">🖼  .notion-image-cache.json</text>

  <rect x="632" y="480" width="288" height="30" rx="4" fill="#0a0d12" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="642" y="499" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf3">📜 runs.jsonl  ·  metrics.jsonl</text>

  <!-- ==================== ARROWS ==================== -->
  <!-- LOCAL → ENGINE -->
  <line x1="248" y1="170" x2="276" y2="170" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="252" y="160" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#22d3ee">scan</text>

  <!-- ENGINE → NOTION -->
  <line x1="684" y1="170" x2="712" y2="170" stroke="#e879f9" stroke-width="2" marker-end="url(#arrow-mag)"/>
  <text x="688" y="160" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#e879f9">push</text>

  <!-- ENGINE → STATE (right side, down to caches) -->
  <path d="M 480 350 Q 480 365 480 376" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="492" y="365" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#fbbf24">log + cache</text>

  <!-- STATE → DASHBOARDS (left arrow from caches box to dashboards) -->
  <line x1="616" y1="445" x2="592" y2="445" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-dim)"/>
  <text x="540" y="438" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#7d8590">read</text>

  <!-- DASHBOARDS → NOTION (up arrow from dashboards box to notion box) -->
  <path d="M 576 376 Q 576 360 716 280" stroke="#3fb950" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="600" y="370" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#3fb950">render pages</text>

  <!-- ==================== Footer ==================== -->
  <rect x="24" y="540" width="912" height="60" rx="6" fill="#0a0d12" stroke="#161b22" stroke-width="1"/>
  <text x="36" y="558" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="#22d3ee">Launchers</text>
  <text x="36" y="572" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#7d8590">bash run.sh  ·  bash sync.sh  ·  bash list.sh  ·  just  ·  /sync-all (Claude skill)</text>
  <text x="36" y="586" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#7d8590">modes: push · push:full · fix · check · dashboard · bring-up · prune</text>
  <text x="924" y="586" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#e879f9" text-anchor="end">PIPELINE.md →</text>
</svg>
